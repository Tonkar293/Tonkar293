<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <style>
    .logo {
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      white-space: pre;
      /* คำสั่งทำให้สีเปลี่ยนไปมา (ชมพู -> ฟ้า -> เขียว) */
      animation: colorCycle 6s infinite;
    }
    @keyframes colorCycle {
      0% { fill: #ff007f; }
      33% { fill: #00f2fe; }
      66% { fill: #00ff66; }
      100% { fill: #ff007f; }
    }
  </style>
  <text x="10" y="20" class="logo">
                   -`
                  .o+`
                 `ooo/
                `+oooo:
               `+oooooo:
               -+oooooo+:
             `/:-:++oooo+:
            `/++++/+++++++:
           `/++++++++++++++:
          `/+++ooooooooooooo/`
         ./ooosssso++osssssso+`
        .oossssso-````/ossssss+`
       -osssssso.      :ssssssso.
      :osssssss/        osssso+++.
     /ossssssss/        +ssssooo/-
   `/ossssso+/:-        -:/+osssso+-
  `+sso+:-`                 `.-/+oso:
 `++:.                           `-/+/
 .`                                 `/
  </text>
</svg>
