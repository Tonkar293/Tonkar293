name: GitHub Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ==========================================
      # 1. คอลัมน์ฝั่งซ้าย (Metrics Left)
      # ==========================================
      - name: Left Column
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tonkar293
          template: classic
          config_timezone: Asia/Bangkok
          base: header, repositories
          base_indepth: yes
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 0

      # ==========================================
      # 2. คอลัมน์ฝั่งขวา (Metrics Right)
      # ==========================================
      - name: Right Column
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tonkar293
          template: classic
          config_timezone: Asia/Bangkok
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_music: yes
          plugin_music_mode: playlist
          plugin_music_playlist: https://embed.music.apple.com/fr/playlist/usr-share/pl.u-V9D7m8kB15514
          plugin_music_limit: 2
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_projects: yes
          plugin_projects_limit: 1
          plugin_projects_descriptions: yes

      # ==========================================
      # 3. สร้างอนิเมชันงูกินตาราง Commit (Snake Animation)
      # ==========================================
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Tonkar293
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push Snake Animation to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snake animation"
          file_pattern: dist/*.svg
